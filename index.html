<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Safe Browser — Современный безопасный браузер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
            background: #0f172a;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ----- КРАСИВАЯ ПЛАВНАЯ ЗАГРУЗКА (сплэш) ----- */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0.8s;
        }

        .splash-content {
            text-align: center;
            animation: fadeInUp 0.6s ease-out forwards;
            padding: 20px;
        }

        /* Градиентное лого вместо картинки */
        .splash-logo {
            width: min(140px, 30vw);
            height: min(140px, 30vw);
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #3b82f6, #a855f7, #ec4898);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.4);
            animation: gentleFloat 2s infinite ease-in-out;
        }

        .splash-logo span {
            font-size: min(70px, 15vw);
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .splash-title {
            font-size: clamp(2.2rem, 10vw, 3.8rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .splash-sub {
            color: #94a3b8;
            font-weight: 500;
            font-size: clamp(0.85rem, 4vw, 1.1rem);
            margin-top: 6px;
        }

        .progress-bar-container {
            width: min(240px, 60vw);
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin-top: 32px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            border-radius: 20px;
            animation: loadProgress 1.2s ease-out forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .splash-hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* ----- ОСНОВНОЙ ИНТЕРФЕЙС БРАУЗЕРА (адаптивный) ----- */
        .browser-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f8fafc;
            opacity: 0;
            transition: opacity 0.5s ease;
            overflow: hidden;
        }

        .browser-visible {
            opacity: 1;
        }

        /* Панель вкладок */
        .tabs-wrapper {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .tabs-bar {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1;
            padding-left: 8px;
            min-width: min-content;
        }

        .tab-item {
            background: #f1f5f9;
            border-radius: 12px 12px 0 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0 10px 0 14px;
            height: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            max-width: 160px;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .tab-item {
                max-width: 120px;
                padding: 0 6px 0 10px;
                font-size: 12px;
            }
        }

        .tab-item.active {
            background: white;
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab-close {
            background: none;
            border: none;
            font-size: 16px;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 30px;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tab-close:hover {
            background: #e2e8f0;
            color: #ef4444;
        }

        .new-tab-btn {
            background: transparent;
            border: none;
            font-size: 24px;
            color: #3b82f6;
            cursor: pointer;
            width: 44px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .new-tab-btn:active {
            background: #eef2ff;
            transform: scale(0.95);
        }

        /* Навигационная панель */
        .nav-bar {
            background: white;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            background: #f1f5f9;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 38px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }

        .nav-btn:active {
            background: #e2e8f0;
            transform: scale(0.94);
        }

        .url-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 60px;
            padding: 4px 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            min-width: 0;
        }

        .url-container:focus-within {
            background: white;
            box-shadow: 0 0 0 3px #3b82f640;
            border-color: #3b82f6;
        }

        .url-icon {
            font-size: 16px;
            margin-right: 6px;
            color: #5b6e8c;
            flex-shrink: 0;
        }

        #urlInput {
            flex: 1;
            border: none;
            background: transparent;
            font-size: clamp(14px, 4vw, 15px);
            padding: 10px 0;
            outline: none;
            font-weight: 500;
            color: #0f172a;
            min-width: 40px;
        }

        .go-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .go-btn:active {
            background: #2563eb;
            transform: scale(0.96);
        }

        @media (max-width: 550px) {
            .nav-bar {
                padding: 6px 10px;
                gap: 6px;
            }
            .nav-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
            .go-btn {
                padding: 5px 12px;
                font-size: 12px;
            }
        }

        /* Контейнер веб-страниц */
        .webview-container {
            flex: 1;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        .iframe-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .browser-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Индикатор загрузки */
        .loading-indicator {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            transition: opacity 0.2s;
            font-family: monospace;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        button {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

<!-- Загрузка -->
<div class="splash-screen" id="splashScreen">
    <div class="splash-content">
        <div class="splash-logo">
            <span>🛡️</span>
        </div>
        <div class="splash-title">Safe</div>
        <div class="splash-sub">Быстрый. Безопасный. Современный.</div>
        <div class="progress-bar-container">
            <div class="progress-fill"></div>
        </div>
    </div>
</div>

<!-- Браузер -->
<div class="browser-container" id="browserContainer">
    <div class="tabs-wrapper">
        <div class="tabs-bar" id="tabsBar"></div>
        <button class="new-tab-btn" id="newTabButton">+</button>
    </div>

    <div class="nav-bar">
        <div class="nav-buttons">
            <button class="nav-btn" id="backBtn">◀</button>
            <button class="nav-btn" id="forwardBtn">▶</button>
            <button class="nav-btn" id="reloadBtn">⟳</button>
        </div>
        <div class="url-container">
            <span class="url-icon">🔒</span>
            <input type="text" id="urlInput" placeholder="Поиск или введите адрес" autocomplete="off">
            <button class="go-btn" id="goBtn">Перейти</button>
        </div>
    </div>

    <div class="webview-container" id="webviewContainer">
        <div class="loading-indicator" id="globalLoading" style="opacity:0;">
            <div class="spinner"></div> Загрузка...
        </div>
    </div>
</div>

<script>
    // ========== БРАУЗЕР С ВКЛАДКАМИ ==========
    let tabs = [];
    let activeTabId = null;
    let tabCounter = 1;

    const tabsBar = document.getElementById('tabsBar');
    const newTabBtn = document.getElementById('newTabButton');
    const webviewContainer = document.getElementById('webviewContainer');
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const backBtn = document.getElementById('backBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const globalLoading = document.getElementById('globalLoading');

    function showLoading(show) {
        globalLoading.style.opacity = show ? '1' : '0';
    }

    // Создание iframe
    function createIframeForTab(tabId, url) {
        const iframe = document.createElement('iframe');
        iframe.className = 'browser-iframe';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.style.display = 'block';
        iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation-by-user-activation allow-downloads');
        iframe.src = url;
        
        iframe.addEventListener('load', function() {
            const tab = tabs.find(t => t.id === tabId);
            if(tab) {
                try {
                    let title = iframe.contentDocument?.title;
                    if(title && title.trim()) tab.title = title.substring(0, 40);
                    else tab.title = new URL(iframe.src).hostname || 'Safe Page';
                    let currentUrl = iframe.contentWindow?.location?.href;
                    if(currentUrl && currentUrl !== tab.url) tab.url = currentUrl;
                } catch(e) { tab.title = 'Новая вкладка'; }
                renderTabs();
                if(activeTabId === tabId) {
                    urlInput.value = tab.url;
                }
            }
            if(activeTabId === tabId) showLoading(false);
        });
        
        iframe.addEventListener('error', () => {
            if(activeTabId === tabId) showLoading(false);
        });
        
        return iframe;
    }

    // Добавить вкладку
    function addTab(url = 'https://www.google.com', activate = true) {
        const id = Date.now() + tabCounter++;
        const iframeEl = createIframeForTab(id, url);
        const wrapperDiv = document.createElement('div');
        wrapperDiv.className = 'iframe-wrapper';
        wrapperDiv.style.width = '100%';
        wrapperDiv.style.height = '100%';
        wrapperDiv.style.display = 'none';
        wrapperDiv.appendChild(iframeEl);
        webviewContainer.appendChild(wrapperDiv);
        
        const newTab = {
            id: id,
            title: 'Новая вкладка',
            url: url,
            iframeElement: iframeEl,
            wrapper: wrapperDiv
        };
        tabs.push(newTab);
        
        if(activate) setActiveTab(id);
        renderTabs();
        return id;
    }

    // Активировать вкладку
    function setActiveTab(tabId) {
        const tab = tabs.find(t => t.id === tabId);
        if(!tab) return;
        activeTabId = tabId;
        
        tabs.forEach(t => {
            if(t.wrapper) t.wrapper.style.display = 'none';
        });
        if(tab.wrapper) tab.wrapper.style.display = 'block';
        urlInput.value = tab.url;
        renderTabs();
        showLoading(false);
    }

    // Закрыть вкладку
    function closeTab(tabId) {
        const index = tabs.findIndex(t => t.id === tabId);
        if(index === -1) return;
        if(tabs[index].wrapper) tabs[index].wrapper.remove();
        tabs.splice(index, 1);
        
        if(tabs.length === 0) {
            addTab('https://www.google.com', true);
        } else {
            if(activeTabId === tabId) {
                const newActive = tabs[Math.min(index, tabs.length-1)];
                setActiveTab(newActive.id);
            } else {
                renderTabs();
            }
        }
        renderTabs();
    }

    // Отрисовать вкладки
    function renderTabs() {
        tabsBar.innerHTML = '';
        tabs.forEach(tab => {
            const tabDiv = document.createElement('div');
            tabDiv.className = `tab-item ${activeTabId === tab.id ? 'active' : ''}`;
            const titleSpan = document.createElement('span');
            titleSpan.className = 'tab-title';
            titleSpan.innerText = tab.title || 'Загрузка...';
            const closeSpan = document.createElement('button');
            closeSpan.className = 'tab-close';
            closeSpan.innerHTML = '✕';
            closeSpan.addEventListener('click', (e) => {
                e.stopPropagation();
                closeTab(tab.id);
            });
            tabDiv.appendChild(titleSpan);
            tabDiv.appendChild(closeSpan);
            tabDiv.addEventListener('click', () => setActiveTab(tab.id));
            tabsBar.appendChild(tabDiv);
        });
    }

    // Навигация
    function navigateTo(input) {
        let query = input.trim();
        if(!query) return;
        let finalUrl;
        if(query.match(/^https?:\/\//i)) {
            finalUrl = query;
        } else if(query.includes('.') && !query.includes(' ')) {
            finalUrl = 'https://' + query;
        } else {
            finalUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        }
        const activeTab = tabs.find(t => t.id === activeTabId);
        if(activeTab && activeTab.iframeElement) {
            showLoading(true);
            activeTab.url = finalUrl;
            activeTab.iframeElement.src = finalUrl;
            activeTab.title = 'Загрузка...';
            renderTabs();
            urlInput.value = finalUrl;
        }
    }

    function goBack() {
        const activeTab = tabs.find(t => t.id === activeTabId);
        if(activeTab?.iframeElement?.contentWindow) {
            try { activeTab.iframeElement.contentWindow.history.back(); }
            catch(e) {}
        }
    }
    
    function goForward() {
        const activeTab = tabs.find(t => t.id === activeTabId);
        if(activeTab?.iframeElement?.contentWindow) {
            try { activeTab.iframeElement.contentWindow.history.forward(); }
            catch(e) {}
        }
    }
    
    function reloadPage() {
        const activeTab = tabs.find(t => t.id === activeTabId);
        if(activeTab?.iframeElement) {
            showLoading(true);
            activeTab.iframeElement.src = activeTab.iframeElement.src;
        }
    }

    // Синхронизация URL
    setInterval(() => {
        const active = tabs.find(t => t.id === activeTabId);
        if(active && active.iframeElement && active.iframeElement.contentWindow) {
            try {
                let newUrl = active.iframeElement.contentWindow.location.href;
                if(newUrl && newUrl !== active.url) {
                    active.url = newUrl;
                    urlInput.value = newUrl;
                    renderTabs();
                }
                let title = active.iframeElement.contentDocument?.title;
                if(title && title !== active.title) {
                    active.title = title.substring(0, 40);
                    renderTabs();
                }
            } catch(e) {}
        }
    }, 800);

    // Инициализация
    function initBrowser() {
        addTab('https://www.google.com', true);
        
        goBtn.addEventListener('click', () => navigateTo(urlInput.value));
        urlInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') navigateTo(urlInput.value); });
        backBtn.addEventListener('click', goBack);
        forwardBtn.addEventListener('click', goForward);
        reloadBtn.addEventListener('click', reloadPage);
        newTabBtn.addEventListener('click', () => addTab('https://www.google.com', true));
    }

    // Запуск с гарантированным закрытием сплэша через 1.5 сек
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            splash.classList.add('splash-hidden');
            const browser = document.getElementById('browserContainer');
            browser.classList.add('browser-visible');
            initBrowser();
        }, 1500);
    });
</script>
</body>
</html>
